<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:; font-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MDReader</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="../../vendor/katex/katex.min.css" />
</head>
<body>
  <!-- Typora 风格一体化标题栏：同色、可拖拽、右侧窗控按钮 -->
  <header id="titlebar">
    <div class="titlebar-drag">
      <span id="titlebar-filename">MDReader</span>
    </div>
    <div class="titlebar-controls">
      <button id="btn-min" type="button" title="最小化" tabindex="-1">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1" fill="none"/></svg>
      </button>
      <button id="btn-max" type="button" title="最大化" tabindex="-1">
        <svg class="icon-maximize" width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" stroke="currentColor" stroke-width="1" fill="none"/></svg>
        <svg class="icon-restore" width="10" height="10" viewBox="0 0 10 10" hidden><path d="M2.5 2.5V0.5h7v7h-2" stroke="currentColor" stroke-width="1" fill="none"/><rect x="0.5" y="2.5" width="7" height="7" stroke="currentColor" stroke-width="1" fill="none"/></svg>
      </button>
      <button id="btn-close" type="button" title="关闭" tabindex="-1">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1" fill="none"/></svg>
      </button>
    </div>
  </header>

  <!-- Typora 风格工具栏：大纲开关 / 打开 / 字号缩放 -->
  <div id="toolbar">
    <button id="tb-outline" type="button" title="大纲 (点击显示/隐藏侧栏)" tabindex="-1">
      <svg width="15" height="15" viewBox="0 0 16 16"><path d="M6.5 4h8M6.5 8h8M6.5 12h5.5" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/><circle cx="3" cy="4" r="1" fill="currentColor"/><circle cx="3" cy="8" r="1" fill="currentColor"/><circle cx="3" cy="12" r="1" fill="currentColor"/></svg>
    </button>
    <span class="tb-sep"></span>
    <button id="tb-open" type="button" title="打开文件 (Ctrl+O)" tabindex="-1">
      <svg width="15" height="15" viewBox="0 0 16 16"><path d="M1.5 3.5h4l1.5 2h7.5v7h-13v-9z" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linejoin="round"/></svg>
    </button>
    <span class="tb-sep"></span>
    <button id="tb-zoom-out" type="button" title="缩小字号" tabindex="-1">
      <svg width="15" height="15" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M10.5 10.5L14 14M5 7h4" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>
    </button>
    <button id="tb-zoom-reset" type="button" title="重置字号" tabindex="-1">
      <svg width="15" height="15" viewBox="0 0 16 16"><path d="M3 13L7 3h2l4 10M4.8 9.5h6.4" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="tb-zoom-in" type="button" title="放大字号" tabindex="-1">
      <svg width="15" height="15" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M10.5 10.5L14 14M5 7h4M7 5v4" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>
    </button>
    <span class="tb-sep"></span>
    <button id="tb-theme" type="button" title="主题" tabindex="-1">
      <svg class="theme-light" width="15" height="15" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.4 1.4M11.55 11.55l1.4 1.4M12.95 3.05l-1.4 1.4M4.45 11.55l-1.4 1.4" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>
      <svg class="theme-dark" width="15" height="15" viewBox="0 0 16 16" hidden><path d="M13.5 9.7A6 6 0 116.3 2.5a4.8 4.8 0 007.2 7.2z" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linejoin="round"/></svg>
      <svg class="theme-system" width="15" height="15" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="9" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M5.5 14h5M8 11.5V14" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>
    </button>
  </div>

  <!-- 主内容区：左侧大纲侧栏（M3-2，可收起）+ 右侧 tab/正文列 -->
  <div id="content-row">
    <aside id="outline" hidden>
      <div id="outline-list"></div>
    </aside>
    <div id="content-col">
      <!-- Tab 栏（M3-1）：仅在有打开文档时显示 -->
      <div id="tabbar" hidden>
        <div id="tabs"></div>
      </div>

      <main id="viewer">
        <div id="empty-state">
          <div class="empty-icon"></div>
          <h1>MDReader</h1>
          <p>按 <kbd>Ctrl</kbd> + <kbd>O</kbd> 打开 Markdown 文档</p>
          <button id="btn-open" type="button">选择文件...</button>
        </div>
        <div id="panes"></div>
        <div id="error-banner" hidden></div>
      </main>
    </div>
  </div>

  <!-- 拖入文件高亮遮罩（M3-3）：dragenter 显示，drop/dragleave 隐藏 -->
  <div id="drop-overlay" hidden>
    <div class="drop-box">放开以打开 Markdown 文档</div>
  </div>

  <script src="../../vendor/markdown-it.min.js"></script>
  <script src="../../vendor/purify.min.js"></script>
  <script src="../../vendor/highlight.min.js"></script>
  <script src="../../vendor/markdown-it-math.min.js"></script>
  <script src="../../vendor/markdown-it-task.min.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
